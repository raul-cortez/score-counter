# Накладка: контейнер слушает только петлю, наружу его выставляет прокси хоста.
#
# Подходит для nginx, Caddy и Traefik с файловым провайдером — всего, что умеет
# проксировать на 127.0.0.1. Снаружи порт недоступен: адрес привязки указан явно,
# иначе Docker пробил бы firewall и открыл его всему интернету.

services:
  app:
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
