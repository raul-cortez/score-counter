# Счётчик очков: приложение и HTTPS одной командой.
#
# Ничего, кроме домена и машины с Docker, не нужно. База данных не нужна тоже:
# всё состояние — один файл SQLite внутри тома score-data.
#
#   docker compose up -d
#
# Caddy сам получит сертификат Let's Encrypt для домена из .env и будет его
# продлевать. Для этого домен должен указывать на эту машину, а порты 80 и 443
# быть свободны.

services:
  app:
    image: ghcr.io/raul-cortez/score-counter:${TAG:-latest}
    container_name: score-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_PATH: /data/score.db
      STATIC_ROOT: /app/public
    volumes:
      # Здесь живёт вся история. Переживает docker compose down.
      - score-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: score-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты переживают перезапуск: иначе Let's Encrypt быстро упрётся
      # в ограничение на число выдач.
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  score-data:
  caddy-data:
  caddy-config:
